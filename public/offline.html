<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>لا يوجد اتصال</title>
<style>
:root{color-scheme:light dark;--bg:#fff;--fg:#111827;--mut:#4b5563;--bd:#d1d5db}
@media (prefers-color-scheme:dark){:root{--bg:#0b0d14;--fg:#f3f4f6;--mut:#9ca3af;--bd:#374151}}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px 16px;background:var(--bg);color:var(--fg);font-family:Tajawal,Cairo,system-ui,sans-serif;text-align:center}
main{max-width:360px}
h1{font-size:1.25rem;margin:0 0 8px}
p{margin:0 0 20px;color:var(--mut);line-height:1.8}
button{min-height:44px;padding:0 24px;border-radius:12px;border:1px solid var(--bd);background:transparent;color:var(--fg);font:inherit;font-weight:700;cursor:pointer}
button:focus-visible{outline:2px solid currentColor;outline-offset:2px}
</style>
</head>
<body>
<main>
<h1>لا يوجد اتصال بالإنترنت</h1>
<p>تعذّر تحميل الصفحة. تأكدوا من الاتصال ثم أعيدوا المحاولة.</p>
<button type="button" onclick="location.reload()">إعادة المحاولة</button>
</main>
</body>
</html>
